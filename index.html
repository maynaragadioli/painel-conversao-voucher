<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de Conversão por Voucher</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{--p:#7656b7;--pd:#54368e;--ps:#f4f0fb;--pl:#ded5ef;--text:#29243a;--muted:#756e82;--green:#217a55;--amber:#996b12;--red:#a73e4b}*{box-sizing:border-box}body{margin:0;background:#f8f7fb;color:var(--text);font-family:Segoe UI,Arial,sans-serif}.page{max-width:1120px;margin:20px auto;padding:0 18px}.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}.upload,.btn{border:1px solid var(--p);border-radius:7px;padding:8px 13px;font:600 11px Segoe UI;background:#fff;color:var(--pd);cursor:pointer}.upload{background:var(--p);color:#fff}.upload input{display:none}.panel{background:#fff;border:1px solid #ebe7f1;border-radius:14px;box-shadow:0 8px 28px #412d6414;overflow:hidden}.hero,.header{padding:18px 24px 15px}.line{width:42px;height:4px;background:var(--p);border-radius:9px;margin-bottom:10px}h1{font-size:20px;margin:0;color:#35284d}h2{font-size:17px;margin:0;color:#35284d}.summary{font-size:11px;color:var(--muted);margin-top:5px}.multi{display:grid;gap:24px;margin-top:18px}.voucher-set{display:grid;gap:14px}.meta{display:grid;grid-template-columns:1fr 2fr 1fr 1fr 1.25fr;background:#fcfbfe;border-block:1px solid #eee9f5}.mi{padding:11px 24px;border-right:1px solid #eee9f5}.mi:last-child{border:0}.lab{display:block;font-size:9px;letter-spacing:.7px;color:#8a8198;font-weight:700;text-transform:uppercase}.inp{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;padding:3px 0;color:#35284d;font:650 13px Segoe UI;outline:none}.inp:focus{border-color:var(--p)}.usage{margin:14px 18px 0;padding:10px 12px;border:1px solid var(--pl);border-left:4px solid var(--p);border-radius:8px;background:#faf8fd;color:#514461;font-size:11px}.usage strong{color:var(--pd)}.content{padding:15px 18px 18px}.tw{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0;min-width:850px}th{padding:9px 10px;background:var(--ps);color:#55456f;font-size:9px;text-transform:uppercase;text-align:left;border-block:1px solid var(--pl)}th:first-child{border-left:1px solid var(--pl);border-radius:7px 0 0 7px}th:last-child{border-right:1px solid var(--pl);border-radius:0 7px 7px 0}td{padding:10px;border-bottom:1px solid #eeeaf2;font-size:11px}td.n{text-align:right}.strong{font-weight:700}.evolution{color:var(--pd);font-weight:700;white-space:nowrap}.pct{font-weight:750;color:var(--pd)}.total td{background:#faf8fd;font-weight:750;border-top:1px solid var(--pl)}.note{font-size:10px;color:var(--muted);margin-top:8px}.tag{display:inline-block;padding:3px 7px;border-radius:99px;font-size:9px;font-weight:700}.ef{background:#e4f3ec;color:var(--green)}.pot{background:#fff3d9;color:var(--amber)}.nef{background:#f9e7ea;color:var(--red)}.cpf{font-family:Consolas,monospace}.empty{text-align:center;padding:34px;color:var(--muted)}@media print{.toolbar,.hero-panel{display:none!important}body{background:#fff}.page{margin:0;max-width:none;padding:0}.panel{box-shadow:none;break-inside:avoid;page-break-inside:avoid}.voucher-set{break-before:page;page-break-before:always}.voucher-set:first-child{break-before:auto;page-break-before:auto}.inp{border:0!important}.content{padding:10px}th,td{font-size:8px;padding:5px}@page{size:A4 landscape;margin:8mm}}@media(max-width:700px){.meta{grid-template-columns:1fr}.mi{border-right:0;border-bottom:1px solid #eee9f5}.page{padding:0 8px}}
</style></head><body><main class="page"><div class="toolbar"><label class="upload">Carregar nova base Excel<input id="file" type="file" accept=".xlsx,.xls"></label><button class="btn" onclick="window.print()">Imprimir / Salvar PDF</button></div><section class="panel hero-panel"><div class="hero"><div class="line"></div><h1>Painel de Conversão por Voucher</h1><div id="summary" class="summary">Carregue uma base Excel para visualizar os vouchers.</div></div></section><div id="multi" class="multi"><div class="panel empty">Nenhuma base carregada.</div></div></main><script>
const $=s=>document.querySelector(s),clean=v=>String(v??'').trim(),norm=s=>clean(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim().replace(/[\s-]+/g,'_'),key=s=>norm(s).toLowerCase().replace(/[^a-z0-9_]/g,'');const E=new Set(['ATIVA','PRE_CONFIRMADA','INSCRITO']);let data=[];
function group(a,f){let m=new Map();a.forEach(x=>{let k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return m}function uniq(a){return [...new Set(a.filter(Boolean))]}function mode(a){let c={};a.filter(Boolean).forEach(v=>c[v]=(c[v]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'Sem informação'}function mask(c){return c.length===11?`***.${c.slice(3,6)}.${c.slice(6,9)}-**`:'CPF inválido'}function esc(v){return clean(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function classify(st){if(st.some(x=>E.has(x)))return['Efetivo','ef','Possui matrícula efetiva, mesmo que também tenha degustação.'];if(st.length&&st.every(x=>x==='DEGUSTACAO'))return['Potencial','pot','Permanece somente em degustação, sem matrícula efetiva.'];return['Não efetivo','nef','Não possui situação efetiva registrada.']}
function analyze(rows){let by=group(rows.filter(x=>x.cpf),x=>x.cpf),total=by.size,repeated=[...by].filter(([,a])=>{let ids=new Set(a.map(x=>x.enrollment).filter(Boolean));return ids.size>1||(!ids.size&&a.length>1)}),repeatedSet=new Set(repeated.map(([cpf])=>cpf)),evolutions=[];repeated.forEach(([cpf,a])=>{let statuses=uniq(a.map(x=>norm(x.status))),effective=statuses.filter(x=>E.has(x)),previous=statuses.filter(x=>!E.has(x));if(effective.length&&previous.length){evolutions.push({cpf,from:previous[0],to:effective[0]})}});let convertedSet=new Set(evolutions.map(x=>x.cpf)),origins=new Map();repeated.forEach(([cpf,a])=>{let statuses=uniq(a.map(x=>norm(x.status))),evo=evolutions.find(e=>e.cpf===cpf);if(evo)origins.set(cpf,evo.from);else origins.set(cpf,statuses[0]||'(VAZIA)')});let sg=group(rows,x=>norm(x.status)||'(VAZIA)'),out=[...sg].map(([st,a])=>{let cp=new Set(a.filter(x=>x.cpf).map(x=>x.cpf)),rep=[...cp].filter(c=>repeatedSet.has(c)&&origins.get(c)===st).length,ev=evolutions.filter(x=>x.to===st);return{st,n:cp.size,p:total?cp.size/total*100:0,pay:mode(a.map(x=>x.payment||'Sem informação')),rep,evolutions:ev}}).sort((a,b)=>b.n-a.n||a.st.localeCompare(b.st));return{total,repeated,repeatedSet,evolutions,convertedSet,out}}
function block(voucher,rows){let a=analyze(rows),store='voucher_meta_'+voucher,m={};try{m=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){}let main=a.out.map(x=>{let ev=x.evolutions.length?uniq(x.evolutions.map(e=>`${e.from} → ${e.to}`)).map(t=>`${t}: ${x.evolutions.filter(e=>`${e.from} → ${e.to}`===t).length} convertido${x.evolutions.filter(e=>`${e.from} → ${e.to}`===t).length>1?'s':''}`).join(' | '):'–';return `<tr><td class="strong">${esc(x.st)}</td><td class="n">${x.n}</td><td class="n pct">${x.p.toFixed(1).replace('.',',')}%</td><td>${esc(x.pay)}</td><td class="n">${x.rep||'–'}</td><td class="evolution">${ev}</td></tr>`}).join('');let evoSummary=a.evolutions.length?uniq(a.evolutions.map(e=>`${e.from} → ${e.to}`)).map(t=>{let n=a.evolutions.filter(e=>`${e.from} → ${e.to}`===t).length;return `<b>${t}</b>: ${n} convertido${n>1?'s':''}`}).join(' | '):'Nenhuma evolução para situação efetiva identificada.';let uses=rows.length,available=Number(m.available||0),usage=available>0?uses/available*100:0;return `<section class="voucher-set"><section class="panel"><header class="header"><div class="line"></div><h1>Conversão por Situação de Matrícula</h1><div class="summary">${rows.length} registros • ${a.total} CPFs únicos • ${a.repeated.length} CPFs repetidos</div></header><section class="meta"><div class="mi"><span class="lab">Data início</span><input class="inp vdate" type="date" data-store="${esc(store)}" value="${esc(m.date||'')}"></div><div class="mi"><span class="lab">Campanha</span><input class="inp vcampaign" data-store="${esc(store)}" value="${esc(m.campaign||'')}" placeholder="Nome da campanha"></div><div class="mi"><span class="lab">Voucher</span><input class="inp" value="${esc(voucher)}" readonly></div><div class="mi"><span class="lab">Data base</span><input class="inp vbase" type="date" data-store="${esc(store)}" value="${esc(m.baseDate||'')}"></div><div class="mi"><span class="lab">Vouchers disponibilizados</span><input class="inp vavailable" type="number" min="0" data-store="${esc(store)}" data-count="${uses}" value="${esc(m.available||'')}" placeholder="0"></div></section><div class="usage" data-usage="${esc(store)}">${available>0?`<strong>${uses} utilizações</strong> de <strong>${available.toLocaleString('pt-BR')} vouchers disponibilizados</strong> | <strong>${usage.toFixed(1).replace('.',',')}% de utilização</strong>`:'Informe a quantidade de vouchers disponibilizados para calcular a taxa de utilização.'}</div><div class="content"><div class="tw"><table><thead><tr><th>Situação da matrícula</th><th style="text-align:right">Alunos únicos</th><th style="text-align:right">% sobre alunos únicos</th><th>Pagamento predominante</th><th style="text-align:right">CPF repetido</th><th>Evolução do CPF</th></tr></thead><tbody>${main}<tr class="total"><td>TOTAL DE CPFs ÚNICOS</td><td class="n">${a.total}</td><td colspan="2"></td><td class="n">${a.repeated.length}</td><td class="evolution">${a.evolutions.length?`${a.evolutions.length} convertido${a.evolutions.length>1?'s':''} • ${a.repeated.length-a.convertedSet.size} sem conversão`:'–'}</td></tr></tbody></table></div><div class="note"><b>Leitura:</b> métricas calculadas exclusivamente para o voucher <b>${esc(voucher)}</b>. Foram identificados <b>${a.repeated.length} CPFs repetidos</b>. ${a.evolutions.length?`Desses, ${a.convertedSet.size} apresentaram evolução para matrícula efetiva: ${evoSummary}. Os demais ${a.repeated.length-a.convertedSet.size} permanecem sem conversão efetiva. Os CPFs repetidos são contabilizados somente na situação de origem; a situação de destino apresenta apenas a evolução.`:'Não foi identificada evolução para matrícula efetiva entre os CPFs repetidos.'}</div></div></section></section>`}
function render(){let g=group(data,x=>x.voucher||'(SEM VOUCHER)');$('#summary').textContent=data.length?`${g.size} voucher(s) • ${data.length} registros carregados`:'Carregue uma base Excel para visualizar os vouchers.';$('#multi').innerHTML=data.length?[...g].sort((a,b)=>a[0].localeCompare(b[0])).map(([v,r])=>block(v,r)).join(''):'<div class="panel empty">Nenhuma base carregada.</div>';document.querySelectorAll('.vdate,.vcampaign,.vbase,.vavailable').forEach(el=>el.oninput=()=>{let k=el.dataset.store,o={};try{o=JSON.parse(localStorage.getItem(k)||'{}')}catch(e){}if(el.classList.contains('vdate'))o.date=el.value;else if(el.classList.contains('vcampaign'))o.campaign=el.value;else if(el.classList.contains('vbase'))o.baseDate=el.value;else o.available=el.value;localStorage.setItem(k,JSON.stringify(o));if(el.classList.contains('vavailable')){let available=Number(el.value),uses=Number(el.dataset.count),box=document.querySelector(`[data-usage="${CSS.escape(k)}"]`);box.innerHTML=available>0?`<strong>${uses} utilizações</strong> de <strong>${available.toLocaleString('pt-BR')} vouchers disponibilizados</strong> | <strong>${(uses/available*100).toFixed(1).replace('.',',')}% de utilização</strong>`:'Informe a quantidade de vouchers disponibilizados para calcular a taxa de utilização.'}})}
function find(h,n){let m={};h.forEach(x=>m[key(x)]=x);return n.map(key).map(k=>m[k]).find(Boolean)}async function load(f){if(!window.XLSX)throw Error('Biblioteca Excel indisponível.');let w=XLSX.read(await f.arrayBuffer(),{type:'array'}),r=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:'',raw:false});if(!r.length)throw Error('A primeira planilha está vazia.');let h=Object.keys(r[0]),cf=find(h,['aluno_cpf']),sf=find(h,['situacao_matricula']),pf=find(h,['meio_pagamento','meios_pagamento']),vf=find(h,['voucher_id','voucher','voucher_codigo','codigo_voucher']),mf=find(h,['matricula_id','id_matricula','matricula_codigo','codigo_matricula']);if(!cf||!sf||!vf)throw Error('A base precisa conter aluno_cpf, situacao_matricula e uma coluna de voucher, como voucher_id ou voucher.');data=r.map((x,i)=>({cpf:clean(x[cf]).replace(/\D/g,''),status:clean(x[sf]),payment:pf?clean(x[pf])||'Sem informação':'Sem informação',voucher:clean(x[vf])||'(SEM VOUCHER)',enrollment:mf?clean(x[mf]):'',row:i+2}));render()}$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{await load(f)}catch(err){alert(err.message);e.target.value=''}};
</script></body></html>
